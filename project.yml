# XcodeGen 工程描述。在 Mac 上运行 `xcodegen generate` 生成 PhonePulse.xcodeproj。
# 改名时同步修改这里的名称 / Bundle ID / App Group，以及 Shared/SharedStore.swift。
name: PhonePulse

options:
  bundleIdPrefix: io.github.adrian-0925
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 填你的 Apple Developer Team ID
    TARGETED_DEVICE_FAMILY: "1"   # 仅 iPhone

targets:
  PhonePulse:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Shared
      - Platform
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhonePulse
        UILaunchScreen: {}
        # 横屏只给充电大屏用，其他页面由 OrientationLock 锁成竖屏
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # "音频、AirPlay 和画中画"后台模式，悬浮网速窗需要它
        UIBackgroundModes:
          - audio
        # 灵动岛 / 锁屏实时活动
        NSSupportsLiveActivities: true
    entitlements:
      path: App/PhonePulse.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.adrian-0925.phonepulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.adrian-0925.phonepulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # App/Assets.xcassets/AppIcon.appiconset，由 docs/icon.html 导出
    dependencies:
      - target: PhonePulseWidget
    scheme:
      testTargets:
        - PhonePulseTests

  PhonePulseWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Core
      - Shared
      - Platform
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PhonePulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PhonePulseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.adrian-0925.phonepulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.adrian-0925.phonepulse.widget
        # 扩展里不能开启实时活动；Platform 中只在 App 进程运行的代码用 #if !WIDGET_EXTENSION 排除
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"

  # 纯逻辑单元测试：直接编译 Core 和 Shared，不依赖宿主 App，在模拟器上运行
  PhonePulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Core
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.adrian-0925.phonepulse.tests
        GENERATE_INFOPLIST_FILE: YES
