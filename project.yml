# XcodeGen 工程描述。在 Mac 上运行 `xcodegen generate` 生成 PhonePulse.xcodeproj。
# 改名时同步修改这里的名称 / Bundle ID / App Group，以及 Shared/SharedStore.swift。
name: PhonePulse

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 填你的 Apple Developer Team ID
    TARGETED_DEVICE_FAMILY: "1"   # 仅 iPhone

targets:
  PhonePulse:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PhonePulse
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # "音频、AirPlay 和画中画"后台模式，悬浮网速窗需要它
        UIBackgroundModes:
          - audio
    entitlements:
      path: App/PhonePulse.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.phonepulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonepulse
    dependencies:
      - target: PhonePulseWidget
    scheme: {}

  PhonePulseWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PhonePulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PhonePulseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.phonepulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonepulse.widget
